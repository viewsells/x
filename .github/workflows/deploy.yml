name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --include=dev

      - name: Build static site
        run: npm run build

      - name: Ensure 404.html, CNAME and SEO assets exist in dist
        run: |
          if [ -f public/404.html ]; then cp public/404.html dist/404.html; else cp dist/index.html dist/404.html; fi
          if [ -f public/CNAME ]; then cp public/CNAME dist/CNAME; fi
          if [ -f public/robots.txt ]; then cp public/robots.txt dist/robots.txt; fi
          if [ -f public/sitemap.xml ]; then cp public/sitemap.xml dist/sitemap.xml; fi
          if [ -f public/llms.txt ]; then cp public/llms.txt dist/llms.txt; fi

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          cname: buygithubaccounts.com

      - name: Setup Pages (GitHub Actions mode)
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload artifact (GitHub Actions mode)
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: './dist'

      - name: Deploy to GitHub Pages (GitHub Actions mode)
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true


