<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2EA043" />
      <stop offset="100%" stop-color="#238636" />
    </linearGradient>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="128" height="128" rx="28" fill="#161B22" />
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#30363D" stroke-width="3" />

  <!-- Inner Terminal Icon Badge -->
  <rect x="20" y="20" width="88" height="88" rx="18" fill="url(#brand-grad)" filter="url(#subtle-shadow)" />

  <!-- Terminal Command Prompt Glyphs -->
  <path d="M40 44 L60 64 L40 84" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="68" y1="84" x2="88" y2="84" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
</svg>
