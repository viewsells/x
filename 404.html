<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Buy GitHub Accounts | Developer Accounts &amp; Promotion Services</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License - https://github.com/rafgraph/spa-github-pages
      var l = window.location;
      var pathSegmentsToKeep = 0;
      
      // If hosted on username.github.io/x, keep 1 segment (/x)
      if (l.hostname.endsWith('github.io') && l.pathname.startsWith('/x')) {
        pathSegmentsToKeep = 1;
      }

      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash;

      window.location.replace(redirectUrl);
    </script>
  </head>
  <body>
    <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; background-color: #161B22; color: #C9D1D9;">
      <p>Redirecting to requested page...</p>
    </div>
  </body>
</html>
